name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - &checkout
        name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$version" || { echo "::error::No rust-version in Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Install Rust stable with rustfmt
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt
      - &cache
        name: Restore build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-machete
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-machete
      # Each check runs even when an earlier one failed, so one run reports them all.
      - name: Check formatting
        if: ${{ !cancelled() }}
        run: cargo xtask fmt --check
      - name: Audit workflows with zizmor
        if: ${{ !cancelled() }}
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
      - name: Run cargo-deny
        if: ${{ !cancelled() }}
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check bans licenses sources
      # install.sh must run under any POSIX sh, not only bash: linted as sh, run with dash.
      - name: Check install.sh with shellcheck
        if: ${{ !cancelled() }}
        run: shellcheck --shell=sh install.sh
      # Installs the latest release, so a change to the archive layout breaks this.
      - name: Install the latest release with install.sh
        if: ${{ !cancelled() }}
        env:
          HOME: ${{ runner.temp }}/install-home
          # The runners set XDG_CONFIG_HOME; empty, install.sh falls back to $HOME.
          XDG_CONFIG_HOME: ""
          XDG_DATA_HOME: ""
        run: |
          mkdir -p "$HOME"
          dash install.sh
          "$HOME/.local/bin/dfdu" --version
          for f in .local/share/man/man1/dfdu.1 .local/share/bash-completion/completions/dfdu \
            .local/share/zsh/site-functions/_dfdu .config/fish/completions/dfdu.fish; do
            test -f "$HOME/$f" || { echo "::error::install.sh did not install ~/$f"; exit 1; }
          done
      # The latest release predates the GUI (1.0), so --gui must install the CLI and then fail.
      - name: Check install.sh --gui installs the latest release's GUI
        if: ${{ !cancelled() }}
        env:
          HOME: ${{ runner.temp }}/install-gui-home
          XDG_CONFIG_HOME: ""
          XDG_DATA_HOME: ""
        run: |
          mkdir -p "$HOME"
          dash install.sh --gui
          test -x "$HOME/.local/bin/dfdu-gui"
          test -f "$HOME/.local/share/applications/app.dfdu.desktop"
          "$HOME/.local/bin/dfdu" --version
      - name: Check install.sh --gui on a release without a GUI
        if: ${{ !cancelled() }}
        env:
          HOME: ${{ runner.temp }}/install-old-gui-home
          XDG_CONFIG_HOME: ""
          XDG_DATA_HOME: ""
        run: |
          mkdir -p "$HOME"
          if dash install.sh --gui --version 0.2.0 2>"$RUNNER_TEMP/gui-err"; then
            echo "::error::install.sh --gui succeeded on 0.2.0, which has no GUI build"; exit 1
          fi
          cat "$RUNNER_TEMP/gui-err"
          grep -qF "dfdu 0.2.0 has no GUI build for this machine; it ships from 0.3.0" "$RUNNER_TEMP/gui-err" ||
            { echo "::error::install.sh --gui did not name the release without a GUI"; exit 1; }
          "$HOME/.local/bin/dfdu" --version
      - name: Find unused dependencies
        if: ${{ !cancelled() }}
        run: cargo xtask machete
      - name: Check the workspace builds on the MSRV
        if: ${{ !cancelled() }}
        run: cargo xtask msrv
      # dfdu-session is shared by the front ends, so it must not pull in a terminal crate.
      - name: Check dfdu-session has no terminal dependencies
        if: ${{ !cancelled() }}
        run: |
          deps=$(cargo tree -p dfdu-session -e normal --prefix none --locked)
          found=$(grep -E '^(ratatui|crossterm|tachyonfx|terminal-colorsaurus) ' <<< "$deps" | sort -u) || true
          test -z "$found" || { echo "::error::dfdu-session depends on ${found//$'\n'/, }"; exit 1; }
      # The fuzz crate is not a workspace member, and only the nightly fuzz run builds it.
      # No --locked: dependency bumps refresh only the root Cargo.lock, and the weekly
      # lock file maintenance refreshes fuzz/Cargo.lock.
      - name: Check the fuzz targets build
        if: ${{ !cancelled() }}
        run: cargo check --manifest-path fuzz/Cargo.toml --bins

  clippy:
    name: Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - *checkout
      - name: Install Rust stable with clippy
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - *cache
      - name: Run clippy
        run: cargo xtask clippy

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux x86_64 runs the tests in the coverage job; arm64 runs them here.
        os: [macos-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - *checkout
      - &stable
        name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - *cache
      - name: Install cargo-nextest
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-nextest
      - name: Run tests and doc tests
        run: cargo xtask test --ci

  coverage:
    name: Test and coverage (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MIN_LINES: 85
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Install Rust stable with llvm-tools
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - *cache
      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Run tests with coverage
        run: cargo xtask coverage --no-fail
      - name: Write coverage report, summary and PR comment
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: .github/scripts/coverage-report.sh "$MIN_LINES" "$BASE"
      - &upload-section
        name: Upload the PR comment section
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-${{ github.job }}
          path: ${{ github.job }}.md
          retention-days: 1
      - name: Require 85% line coverage
        run: cargo llvm-cov report --summary-only --fail-under-lines "$MIN_LINES"
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: lcov.info
          retention-days: 14

  bench:
    name: Benchmark against base
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - *checkout
      - name: Check out base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - *stable
      - name: Install hyperfine
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: hyperfine
      - name: Time warm scans of base and head
        run: .github/scripts/bench-base.sh base "$RUNNER_TEMP"
      - *upload-section

  pr-comment:
    name: PR comment
    needs: [coverage, bench]
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Check out the comment script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Download the comment sections
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pr-*
          merge-multiple: true
          path: ${{ runner.temp }}/pr
      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          for part in coverage bench; do
            f=$RUNNER_TEMP/pr/$part.md
            if [[ -f $f ]]; then cat "$f"; else echo "No $part result: the job failed."; fi
            echo
          done > "$RUNNER_TEMP/comment.md"
          .github/scripts/sticky-comment.sh ci "$RUNNER_TEMP/comment.md"

  simulation:
    name: Simulation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - *checkout
      - *stable
      - *cache
      - name: Run simulation, 5000 seeds per suite
        run: cargo xtask sim --seeds 5000

  loom:
    name: Loom
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - *checkout
      - *stable
      - *cache
      - name: Run loom model tests
        run: cargo xtask loom

  fuse:
    name: FUSE
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - *checkout
      - *stable
      - *cache
      - name: Load the fuse kernel module
        run: sudo modprobe fuse || true
      - name: Build tests
        run: cargo test --profile ci --locked --no-run -p dfdu-hangfs -p dfdu-demofs -p dfdu-engine -p dfdu
      - name: Run FUSE tests as root
        run: |
          cargo test --profile ci --locked -p dfdu-hangfs --lib
          cargo test --profile ci --locked -p dfdu-demofs --test mount
          cargo test --profile ci --locked -p dfdu-engine -p dfdu --test fuse
        env:
          DFDU_FUSE_REQUIRED: "1"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo --preserve-env=DFDU_FUSE_REQUIRED,HOME

  btrfs:
    name: Btrfs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - *checkout
      - *stable
      - *cache
      - name: Set the btrfs mount directory
        run: echo "DFDU_BTRFS_DIR=$RUNNER_TEMP/btrfs" >> "$GITHUB_ENV"
      - name: Install btrfs tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends btrfs-progs btrfs-compsize
      - name: Build tests
        run: |
          cargo test --profile ci --locked --no-run -p dfdu-sys -p dfdu-clean -p dfdu-engine -p dfdu-tui -p dfdu-store
          cargo test --profile ci --locked --no-run -p dfdu --test sudo
      - name: Create the btrfs fixture
        run: sudo scripts/btrfs-fixture.sh "$RUNNER_TEMP/btrfs.img" "$DFDU_BTRFS_DIR" "$(id -un)"
      - name: Run btrfs tests unprivileged
        run: |
          cargo test --profile ci --locked -p dfdu-sys -p dfdu-engine --test btrfs
          cargo test --profile ci --locked -p dfdu-tui --lib tests::btrfs::
      - name: Run btrfs tests as root
        run: |
          cargo test --profile ci --locked -p dfdu-sys -p dfdu-engine --test btrfs
          cargo test --profile ci --locked -p dfdu-tui --lib tests::btrfs::
          cargo test --profile ci --locked -p dfdu-store --test resume btrfs
          cargo test --profile ci --locked -p dfdu-clean --lib
          cargo test --profile ci --locked -p dfdu-sys --test acting
          cargo test --profile ci --locked -p dfdu --test sudo
        env:
          # Empty: the elevated agent's test runs the agent directly, already as root.
          DFDU_ELEVATE_COMMAND: ""
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo --preserve-env=DFDU_BTRFS_DIR,DFDU_ELEVATE_COMMAND,HOME

  gui:
    name: GUI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - *checkout
      - name: Install Rust stable with clippy
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - *cache
      - name: Install the windowing libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Run clippy on dfdu-gui
        run: cargo clippy -p dfdu-gui --all-targets --locked -- -D warnings
      - name: Run the dfdu-gui tests
        run: cargo test -p dfdu-gui --locked
      # The GUI ships on its own: the dfdu binary must not pull in a window toolkit.
      - name: Check dfdu has no GUI dependencies
        run: |
          deps=$(cargo tree -p dfdu -e normal --prefix none --locked)
          found=$(grep -E '^(egui|eframe|wgpu|winit) ' <<< "$deps" | sort -u) || true
          test -z "$found" || { echo "::error::dfdu depends on ${found//$'\n'/, }"; exit 1; }

  ci-success:
    name: CI success
    if: always()
    needs:
      [lint, clippy, test, coverage, simulation, loom, fuse, btrfs, gui]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
