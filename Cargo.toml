[workspace]
resolver = "3"
members = ["crates/*"]
default-members = [
    "crates/dfdu",
    "crates/dfdu-clean",
    "crates/dfdu-dupes",
    "crates/dfdu-engine",
    "crates/dfdu-hangfs",
    "crates/dfdu-rules",
    "crates/dfdu-scan",
    "crates/dfdu-session",
    "crates/dfdu-sim",
    "crates/dfdu-store",
    "crates/dfdu-sys",
    "crates/dfdu-tree",
    "crates/dfdu-tui",
    "crates/dfdu-update",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/jordond/dfdu"
homepage = "https://github.com/jordond/dfdu"
publish = false

[workspace.dependencies]
dfdu-tree = { path = "crates/dfdu-tree", version = "0.6.0" }
dfdu-scan = { path = "crates/dfdu-scan", version = "0.6.0" }
dfdu-engine = { path = "crates/dfdu-engine", version = "0.6.0" }
dfdu-clean = { path = "crates/dfdu-clean", version = "0.6.0" }
dfdu-rules = { path = "crates/dfdu-rules", version = "0.6.0" }
dfdu-tui = { path = "crates/dfdu-tui", version = "0.6.0" }
dfdu-session = { path = "crates/dfdu-session", version = "0.6.0" }
dfdu-sys = { path = "crates/dfdu-sys", version = "0.6.0" }
dfdu-store = { path = "crates/dfdu-store", version = "0.6.0" }
dfdu-bench = { path = "crates/dfdu-bench" }
dfdu-dupes = { path = "crates/dfdu-dupes", version = "0.6.0" }
dfdu-update = { path = "crates/dfdu-update", version = "0.6.0", default-features = false }
crossbeam-channel = "0.5.17"
crossbeam-deque = "0.8.8"
parking_lot = "0.13.0"
clap = { version = "4.6.9", features = ["derive"] }
clap_mangen = "0.3.4"
clap_complete = "4.6.12"
anyhow = "1.0.104"
os_str_bytes = { version = "7.2.1", features = ["conversions"] }
dunce = "1.0.5"
trash = "5.4.0"
etcetera = "0.11.0"
crc32c = "0.6.9"
twox-hash = { version = "2.1.5", default-features = false, features = ["std", "xxhash3_128"] }
sha2 = "0.11.1"
# Not `rustls`, which bundles webpki-roots: certificates come from the platform verifier only.
# `_ring` is how ureq spells "rustls with ring" without the bundled roots; it is not public API,
# so check it still exists when upgrading ureq.
ureq = { version = "3.5.2", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier"] }
lzma-rust2 = { version = "0.25.0", default-features = false, features = ["std", "xz"] }
tar = { version = "0.4.46", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
hex = "0.4.3"
getrandom = "0.4.3"
zeroize = "1.9.2"
# Remembered ssh passwords: Keychain on macOS, Credential Manager on Windows, the Secret Service
# elsewhere.
keyring = "4.2.0"
boon = "0.6.1"
gix-index = "0.58.0"
gix-discover = "0.57.1"
gix-hash = { version = "0.28.1", features = ["sha1"] }
gix-path = "0.14.1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
ruzstd = "0.9.1"
fixedbitset = "0.5.9"
tempfile = "3.27.0"
rustix = { version = "1.1.6", features = ["fs", "process"] }
libc = "0.2.191"
sysinfo = { version = "0.40.4", default-features = false, features = ["disk"] }
rand = { version = "0.10.4", default-features = false, features = ["chacha"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
unicode-width = "0.2.3"
tachyonfx = { version = "0.25.2", default-features = false, features = ["std", "std-duration"] }
nucleo-matcher = "0.3.1"
terminal-colorsaurus = "1.0.3"
insta = "1.49.0"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
toml = { version = "1.2.2", default-features = false, features = ["std", "serde", "parse"] }
loom = "0.7.3"
windows-sys = { version = "0.61.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }
fuser = { version = "0.19.0", default-features = false }
# The macOS privileged helper (crates/dfdu-sys/src/macos/helper): `SMAppService` to register the
# launchd daemon, blocks for the XPC handlers, and Authorization Services for the per-scan
# administrator prompt (Core Foundation for the right's definition). The versions eframe and rfd
# already bring in.
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
objc2-security = { version = "0.3.2", default-features = false, features = ["std", "Authorization", "AuthorizationDB"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFDictionary", "CFNumber", "CFString"] }
dfdu-hangfs = { path = "crates/dfdu-hangfs" }
# The GUI's, used by crates/dfdu-gui only. egui changes its API with every minor version, so the
# family is pinned exactly and upgraded on purpose. Renderers: wgpu, and glow (OpenGL) when wgpu
# finds no adapter. `persistence` keeps the window's size and the GUI's settings between runs.
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "persistence", "wayland", "wgpu", "x11"] }
egui = { version = "=0.37.0", default-features = false }
egui_extras = { version = "=0.37.0", default-features = false }
egui_kittest = "=0.37.0"
# The folder picker: the system's dialog, through the XDG desktop portal on Linux (no GTK).
rfd = { version = "=0.18.0", default-features = false, features = ["xdg-portal"] }
# Only to load Wayland's library at run time, as eframe's default features do, so a Linux build
# needs no Wayland headers; and to draw window decorations where the compositor leaves them out.
winit = { version = "=0.30.13", default-features = false, features = ["wayland-dlopen", "wayland-csd-adwaita"] }

[workspace.lints.rust]
unsafe_code = "forbid"
# `--cfg loom` builds the scanner's synchronisation on `loom` (crates/dfdu-scan/src/sync.rs).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
dbg_macro = "warn"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1

# Optimised test builds that keep debug assertions and overflow checks, without release's slow LTO.
[profile.ci]
inherits = "release"
debug-assertions = true
overflow-checks = true
lto = false
codegen-units = 16

# The release build: `dist build` and `cargo build --profile dist`.
[profile.dist]
inherits = "release"
lto = "fat"
strip = true
